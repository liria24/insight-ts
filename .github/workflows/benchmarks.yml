name: Benchmarks

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:

permissions:
    checks: write
    contents: read
    pull-requests: write

jobs:
    bencher:
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.4.0
            - run: bun ci
            - run: bun --filter insight-ts bench:json
            - uses: bencherdev/bencher@8d75325c3bc59403a2186a056b472c4f49d42838 # v0.6.12
            - name: Report benchmark results
              env:
                  BENCHER_API_KEY: ${{ secrets.BENCHER_API_KEY }}
                  BENCHER_PROJECT: ${{ vars.BENCHER_PROJECT }}
              run: |
                  if [ -z "$BENCHER_PROJECT" ] || [ -z "$BENCHER_API_KEY" ]; then
                    echo "Bencher reporting is disabled until BENCHER_PROJECT and BENCHER_API_KEY are configured."
                    exit 0
                  fi

                  if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
                    bencher run \
                      --project "$BENCHER_PROJECT" \
                      --key "$BENCHER_API_KEY" \
                      --branch "$GITHUB_HEAD_REF" \
                      --start-point "$GITHUB_BASE_REF" \
                      --start-point-hash "${{ github.event.pull_request.base.sha }}" \
                      --start-point-clone-thresholds \
                      --start-point-reset \
                      --testbed ubuntu-latest \
                      --adapter js_vitest \
                      --file packages/insight-ts/benchmark-results.json \
                      --github-actions "${{ github.token }}" \
                      --ci-id insight-ts
                  else
                    bencher run \
                      --project "$BENCHER_PROJECT" \
                      --key "$BENCHER_API_KEY" \
                      --branch "$GITHUB_REF_NAME" \
                      --testbed ubuntu-latest \
                      --adapter js_vitest \
                      --file packages/insight-ts/benchmark-results.json \
                      --github-actions "${{ github.token }}" \
                      --ci-id insight-ts
                  fi
