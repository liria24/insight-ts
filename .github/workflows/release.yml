name: Release

on:
    push:
        branches: [main]
    pull_request:
        types: [closed]
        branches: [main]
    workflow_dispatch:

permissions: {}

jobs:
    pr:
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: danielroe/uppt/pr@7bcfb5397c37202ef882363f755423130419d28a # v0.5.5
              with:
                  packages: packages/analytics
                  token: ${{ secrets.GITHUB_TOKEN }}

    release:
        if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v') && github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        concurrency:
            group: release
            cancel-in-progress: false
        permissions:
            actions: write
            contents: write
        steps:
            - uses: danielroe/uppt/release@7bcfb5397c37202ef882363f755423130419d28a # v0.5.5
              with:
                  packages: packages/analytics
                  token: ${{ secrets.GITHUB_TOKEN }}

    pack:
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            files: ${{ steps.pack.outputs.files }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: 24
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: 1.3.14
            - run: bun ci
            - id: pack
              uses: danielroe/uppt/pack@7bcfb5397c37202ef882363f755423130419d28a # v0.5.5
              with:
                  checkout: false
                  install: false
                  packages: packages/analytics

    publish:
        if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v') && needs.pack.outputs.files != ''
        needs: pack
        runs-on: ubuntu-latest
        permissions:
            id-token: write
        environment: npm
        steps:
            - uses: danielroe/uppt/publish@7bcfb5397c37202ef882363f755423130419d28a # v0.5.5
              with:
                  files: ${{ needs.pack.outputs.files }}
